# pip.conf — HF-Space-v4 Build-Konfiguration
#
# User-Feedback 2026-07-08: "du wolltest doch only binary all setztlen,
# ach das bitte. keine krücken."
#
# Problem: pip 24+ im HF-Python:3.13-Image fällt für numpy (und andere)
# auf sdist-Build zurück, weil keine passende cp313-manylinux-Wheel
# exakt gefunden wird. Build aus Source braucht >10 GB RAM
# (Compiler + Linker + meson/numpy-Build-System) → OOMKilled auf
# HF free tier 16 GB build-RAM.
#
# Fix: only-binary=:all: erzwingt pip, NUR Wheels zu installieren.
# Falls keine passende Wheel verfügbar, schlägt pip fehl — explizit
# und sicher, statt unkontrolliert RAM zu fressen.
#
# HF-Image Dockerfile: `pip install -r /tmp/requirements.txt` läuft
# im Workdir /app/. pip 24+ sucht automatisch nach /app/pip.conf
# (siehe PEP 660 / pip docs "config-file"). Wird durch
# `COPY --link ./ /app` ins Image kopiert.
#
# Format: INI (Standard pip-Konfig). Siehe:
# https://pip.pypa.io/en/stable/topics/configuration/

[install]
only-binary = :all:
prefer-binary = true
